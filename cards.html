<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Round cards · शोध Shodh</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600&family=Rozha+One&display=swap" rel="stylesheet">
  <style>
    /* Printable round Shodh cards, 3.5 inches across, six to a page.
       Open cards.html?size=letter or ?size=a4 (add &deck=small for the 6-symbol deck)
       and print / save as PDF. The PDFs in downloads/ are made from this page
       (tools/build-cards.sh). Which symbols go on which card: deck.js. */
    :root { --d: 3.5in; --edge: #0f6e6e; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { margin: 0; background: #e9e4d8; font: 14px/1.4 Mukta, system-ui, sans-serif; color: #2b1b12; }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; padding: 12px; background: #fffdf8; border-bottom: 1px solid #e4dccb; }
    .bar a, .bar button { font: 600 14px Mukta, sans-serif; color: #0f6e6e; background: none; border: 0; cursor: pointer; text-decoration: none; padding: 6px 4px; }
    .bar a.is-on { color: #2b1b12; text-decoration: underline; text-underline-offset: 4px; }
    .bar button { color: #fff; background: #0f6e6e; padding: 9px 16px; border-radius: 4px; }
    .page { width: var(--pw); height: var(--ph); margin: 24px auto; background: #fff; display: grid; grid-template-columns: repeat(2, var(--d)); grid-auto-rows: var(--d); justify-content: center; align-content: center; gap: var(--gap); box-shadow: 0 6px 24px rgba(0, 0, 0, .15); break-after: page; }
    .page:last-child { break-after: auto; }
    .card { position: relative; width: var(--d); height: var(--d); border-radius: 50%; border: 1.6pt solid var(--edge); overflow: hidden; background: #fff; }
    .card img { position: absolute; height: auto; transform: translate(-50%, -50%) rotate(var(--r)); }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="download.html">← Back to the website</a>
    <span id="links"></span>
    <button type="button" onclick="window.print()">Print / save as PDF</button>
  </div>
  <main id="pages"></main>
  <script src="deck.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var size = q.get('size') === 'a4' ? 'a4' : 'letter';
      var small = q.get('deck') === 'small';
      var deck = small ? window.SHODH_DECK_6 : window.SHODH_DECK;
      // three rows of 3.5in circles take 10.5in, so on Letter (11in tall) the rows sit close together
      var PAGE = size === 'a4' ? { w: '210mm', h: '297mm', gap: '0.28in 0.45in' } : { w: '8.5in', h: '11in', gap: '0.08in 0.5in' };
      var root = document.documentElement.style;
      root.setProperty('--pw', PAGE.w); root.setProperty('--ph', PAGE.h); root.setProperty('--gap', PAGE.gap);
      var st = document.createElement('style');
      st.textContent = '@page { size: ' + (size === 'a4' ? 'A4' : 'letter') + ' portrait; margin: 0; }';
      document.head.appendChild(st);
      document.getElementById('links').innerHTML = ['letter', 'a4'].map(function (s) {
        return '<a href="?size=' + s + (small ? '&deck=small' : '') + '"' + (s === size ? ' class="is-on"' : '') + '>' + (s === 'a4' ? 'A4' : 'US Letter') + '</a>';
      }).join(' · ');
      if (!deck) { document.getElementById('pages').innerHTML = '<p style="text-align:center">This deck isn’t ready yet.</p>'; return; }

      // a fixed shuffle per card, so the PDF comes out the same every time
      function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
      // one symbol in the middle, the rest in a ring; mixed sizes, tilted, now and then upside down
      function layout(n, rand) {
        var ring = n - 1, r = n > 6 ? 31 : 29, w = n > 6 ? 23 : 27, turn = rand() * 360, out = [[50, 50, w * 1.25]];
        for (var i = 0; i < ring; i++) {
          var a = (turn + i * 360 / ring + (rand() * 10 - 5)) * Math.PI / 180;
          out.push([50 + r * Math.cos(a), 50 + r * Math.sin(a), w * (0.86 + rand() * 0.24)]);
        }
        return out;
      }
      var html = '', perPage = 6;
      deck.forEach(function (card, k) {
        if (k % perPage === 0) html += (k ? '</section>' : '') + '<section class="page">';
        var rand = rng(k + 1), ids = card.slice();
        for (var i = ids.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
        var slots = layout(ids.length, rand);
        html += '<div class="card" aria-label="Card ' + (k + 1) + '">' + ids.map(function (id, i) {
          var s = slots[i], flip = rand() < 0.12 ? 180 : 0, rot = Math.round(flip + rand() * 70 - 35);
          return '<img src="images/symbols/' + id + '.png" alt="" style="left:' + s[0].toFixed(1) + '%;top:' + s[1].toFixed(1) + '%;width:' + s[2].toFixed(1) + '%;--r:' + rot + 'deg">';
        }).join('') + '</div>';
      });
      document.getElementById('pages').innerHTML = html + '</section>';
    })();
  </script>
</body>
</html>
