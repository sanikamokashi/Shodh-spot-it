<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shodh symbol guide</title>
  <meta name="description" content="All 57 symbols in Shodh – The Culture Search, with their names in Marathi and Hindi and what each one means. Printable.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Rozha+One&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <style>
    /* Printable symbol guide, one per language. Open guide.html?lang=mr (Marathi) or ?lang=hi (Hindi),
       plus &size=letter or &size=a4, and print / save as PDF.
       The PDFs in downloads/ are made from this page (tools/build-guide.sh). */
    :root { --ink: #2b1b12; --ink-soft: #5d4c40; --gold: #c9a227; --gold-deep: #91751c; --accent: #0f6e6e; --line: #e4dccb; --bg: #fdfbf7; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 Mukta, system-ui, sans-serif; }
    .page { max-width: 1000px; margin: 0 auto; padding: 32px 28px 40px; }
    .bar { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-bottom: 16px; font-size: 14px; }
    .bar button, .bar a { font: 600 14px Mukta, sans-serif; color: #fff; background: var(--accent); border: 0; padding: 9px 16px; cursor: pointer; text-decoration: none; letter-spacing: .04em; }
    .bar a.sec { background: none; color: var(--accent); padding: 9px 4px; }
    .bar a.is-on { background: none; color: var(--ink); padding: 9px 4px; }
    .bar a.lang-link { background: none; color: var(--accent); padding: 9px 4px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 14px; border-bottom: 2px solid var(--gold); }
    .mark { height: 64px; width: auto; fill: var(--gold-deep); display: block; }
    header h1 { margin: 6px 0 0; font: 400 30px/1.1 "Rozha One", Georgia, serif; white-space: nowrap; }
    header > div { flex: none; }
    header p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13.5px; max-width: 560px; text-align: right; }
    header h1 .lang { margin-left: 10px; font: 500 20px Mukta, sans-serif; color: var(--gold-deep); }
    h2 { margin: 22px 0 8px; font: 600 12px Mukta, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-deep); break-after: avoid; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .keep + .grid { margin-top: 6px; }
    /* a heading never ends a page: it stays with its first row of cards */
    .keep { break-inside: avoid; page-break-inside: avoid; }
    .card { display: grid; grid-template-columns: minmax(0, 1fr) 58px; column-gap: 10px; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; break-inside: avoid; page-break-inside: avoid; }
    .card img { grid-column: 2; grid-row: 1 / span 2; width: 58px; height: 58px; object-fit: contain; }
    .card h3 { margin: 0; font: 600 15px/1.2 Mukta, sans-serif; }
    .names { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }
    .names b { font-weight: 500; color: var(--ink); font-size: 14px; }
    .names span { display: block; }
    .names i { font-style: normal; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-deep); margin-right: 4px; }
    .card p { grid-column: 1 / -1; margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-soft); }
    footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-soft); }
    @media print {
      .bar { display: none; }
      body { background: #fff; }
      .page { max-width: none; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="bar">
      <a class="sec" href="symbols.html">← Back to the website</a>
      <span id="lang-links"></span>
      <button type="button" onclick="window.print()">Print / save as PDF</button>
    </div>
    <header>
      <div>
        <svg class="mark" viewBox="0 0 1672 794" role="img" aria-label="शोध"><use href="#shodh-word"/></svg>
        <h1>Symbol guide <span class="lang" id="lang-name"></span></h1>
      </div>
      <p>All 57 symbols in <b>Shodh – The Culture Search</b>, with their names in <span id="lang-word">Marathi</span> and what each one means. Keep it next to the cards while you play.</p>
    </header>
    <main id="guide"></main>
    <footer><span>Shodh – The Culture Search</span><span>Free to print and share at home</span></footer>
  </div>
  <script src="symbols.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var size = (q.get('size') || '').toLowerCase();
      var lang = q.get('lang') === 'hi' ? 'hi' : 'mr';
      var LANG = { mr: ['Marathi', 'मराठी'], hi: ['Hindi', 'हिंदी'] };
      document.getElementById('lang-word').textContent = LANG[lang][0];
      var ln = document.getElementById('lang-name'); ln.textContent = LANG[lang][1]; ln.lang = lang;
      document.title = 'Symbol guide (' + LANG[lang][0] + ') · शोध Shodh';
      document.getElementById('lang-links').innerHTML = ['mr', 'hi'].map(function (l) {
        return l === lang ? '<a class="is-on" aria-current="page">' + LANG[l][0] + '</a>' : '<a class="lang-link" href="?lang=' + l + (size ? '&size=' + size : '') + '">' + LANG[l][0] + '</a>';
      }).join(' · ');
      var st = document.createElement('style');
      st.textContent = '@page { size: ' + (size === 'a4' ? 'A4' : 'letter') + ' portrait; margin: 12mm 11mm; }';
      document.head.appendChild(st);
      var GROUPS = [['divine', 'Gods and goddesses'], ['ritual', 'Rituals and worship'], ['festival', 'Festivals'], ['food', 'Food'], ['play', 'Games and music'], ['nation', 'India']];
      var names = function (s) {
        var n = s.names.filter(function (x) { return x.lang === lang; })[0] || s.names[0];
        return '<span><b lang="' + lang + '">' + n.dev + '</b> ' + n.tr + '</span>';
      };
      document.getElementById('guide').innerHTML = GROUPS.map(function (g) {
        var list = window.SHODH_SYMBOLS.filter(function (s) { return s.cat === g[0]; });
        var card = function (s) {
          return '<div class="card"><h3>' + s.name + '</h3><img src="images/symbols/' + s.id + '.png" alt=""><div class="names">' + names(s) + '</div><p>' + s.text + '</p></div>';
        };
        var rest = list.slice(3);
        return '<section><div class="keep"><h2>' + g[1] + '</h2><div class="grid">' + list.slice(0, 3).map(card).join('') + '</div></div>'
          + (rest.length ? '<div class="grid">' + rest.map(card).join('') + '</div>' : '') + '</section>';
      }).join('');
    })();
  </script>
